[package]
name = "rusty-embedder-http"
description = "Generic REST Embedder backend for rusty_embedder: any OpenAI-compatible embeddings endpoint, over reqwest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rusty-embedder-core = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
